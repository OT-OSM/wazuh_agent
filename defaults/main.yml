# =====================================================
# VERSION
# =====================================================
wazuh_agent_version: "4.7.0"

# =====================================================
# MANAGER CONNECTION
# Manager_host should have Private IP
# =====================================================

wazuh_agent_manager_host: "192.168.8.171"
wazuh_agent_manager_port: 1514
wazuh_agent_protocol: "tcp"
wazuh_agent_notify_time: 10
wazuh_agent_reconnect_time: 60

# =====================================================
# AUTO REGISTRATION
# =====================================================
wazuh_agent_auto_register: true
wazuh_agent_enrollment_port: 1515
wazuh_agent_registration_password: ""

# =====================================================
# FEATURES
# =====================================================
wazuh_agent_user_audit: true
wazuh_agent_home_directory_check: true

# =====================================================
# CONFIG
# =====================================================
wazuh_agent_config_path: "/var/ossec/etc/ossec.conf"
wazuh_agent_log_sources:
  - { format: "syslog", path: "/var/log/auth.log" }
  - { format: "syslog", path: "/var/log/syslog" }
  - { format: "syslog", path: "/var/log/kern.log" }
