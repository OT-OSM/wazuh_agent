---
# =====================================================
# PACKAGE DEFINITIONS
# =====================================================

wazuh_agent_package_debian: "wazuh-agent"
wazuh_agent_package_rhel: "wazuh-agent"

# =====================================================
# SERVICE
# =====================================================

wazuh_agent_service_name: "wazuh-agent"

# =====================================================
# CONFIGURATION PATH
# =====================================================

wazuh_agent_config_file: "/var/ossec/etc/ossec.conf"

# =====================================================
# REPOSITORY
# =====================================================

wazuh_agent_repo_gpg_key_url: "https://packages.wazuh.com/key/GPG-KEY-WAZUH"

wazuh_agent_repo_url_debian: "deb https://packages.wazuh.com/4.x/apt/ stable main"

wazuh_agent_repo_url_rhel: "https://packages.wazuh.com/4.x/yum/"

# =====================================================
# OS-SPECIFIC PACKAGE RESOLUTION
# =====================================================

wazuh_agent_package_name: >-
  {{
    wazuh_agent_package_debian
    if ansible_os_family == "Debian"
    else wazuh_agent_package_rhel
  }}