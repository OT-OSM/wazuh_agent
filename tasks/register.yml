---
# =====================================================
# Wait for Wazuh manager enrollment port
# =====================================================

- name: Wait for Wazuh manager enrollment port
  ansible.builtin.wait_for:
    host: "{{ wazuh_agent_manager_host }}"
    port: "{{ wazuh_agent_enrollment_port }}"
    timeout: 60


# =====================================================
# Check if agent already registered
# =====================================================

- name: Check if agent already registered
  ansible.builtin.stat:
    path: /var/ossec/etc/client.keys
  register: agent_keys


# =====================================================
# Register agent
# =====================================================

- name: Register agent with manager
  ansible.builtin.command: >
    /var/ossec/bin/agent-auth
    -m {{ wazuh_agent_manager_host }}
    -p {{ wazuh_agent_enrollment_port }}
  when: not agent_keys.stat.exists
  notify: Restart wazuh-agent


# =====================================================
# Verify registration
# =====================================================

- name: Verify agent key file exists
  ansible.builtin.stat:
    path: /var/ossec/etc/client.keys
  register: agent_registered


- name: Fail if agent registration failed
  ansible.builtin.fail:
    msg: "Wazuh agent registration failed."
  when: not agent_registered.stat.exists